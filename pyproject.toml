[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lexforge-ai"
version = "1.0.0"
description = "LexForge AI — The Legal Language Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.9,<15", "typer>=0.16,<1"]

[project.optional-dependencies]
ml = ["torch>=2.7,<3", "transformers==4.52.4", "safetensors>=0.5,<1"]
train = ["lexforge-ai[ml]", "pandas>=2.2,<3", "pyarrow>=16,<25", "scikit-learn>=1.6,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
lexforge = "lexforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexforge = ["assets/*.json", "assets/*.json.gz", "assets/*.safetensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
